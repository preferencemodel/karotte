[project]
site_name = "karotte"
site_description = "Build robust RL environments to train aligned AI."
site_url = "https://karotte.dev/"
repo_url = "https://github.com/preferencemodel/karotte"
repo_name = "preferencemodel/karotte"
edit_uri = "edit/main/docs/"
copyright = 'MIT licensed. Carrot icon from <a href="https://github.com/googlefonts/noto-emoji">Noto Emoji</a>, <a href="https://github.com/googlefonts/noto-emoji/blob/main/LICENSE">Apache 2.0</a>.'
extra_css = ["stylesheets/extra.css"]
nav = [
  { "Home" = "index.md" },
  { "Getting started" = [
    "getting-started/installation.md",
    "getting-started/quick-start.md",
    "getting-started/concepts.md",
  ] },
  { "Writing tasks" = [
    "tasks/tasks-and-steps.md",
    "tasks/scoring.md",
    "tasks/tools.md",
    "tasks/data-and-dependencies.md",
    "tasks/artifacts-and-transcripts.md",
    "tasks/creating-tasks-in-code.md",
  ] },
  { "Running" = [
    "running/run-config.md",
    "running/runtimes.md",
    "running/run-lifecycle.md",
    "running/student-resources.md",
    "running/development-loop.md",
  ] },
  { "Environments" = [
    "environments/templates.md",
    "environments/language-toolchains.md",
    "environments/updating.md",
  ] },
  { "Extending karotte" = [
    "extending/template-packages.md",
    "extending/plugins.md",
    "extending/backend.md",
    "extending/developing-karotte.md",
  ] },
]

[project.theme]
language = "en"
logo = "assets/carrot.svg"
favicon = "assets/carrot.svg"
features = [
  "content.action.edit",
  "content.code.copy",
  "content.tabs.link",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.path",
  "navigation.sections",
  "navigation.top",
  "search.highlight",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[project.markdown_extensions]
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
toc.permalink = true
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tasklist.custom_checkbox = true

[project.theme.icon]
repo = "fontawesome/brands/github"
