<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Karotte framework comparison</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; }
  body {
    width: 1600px; height: 900px;
    font-family: Inter, -apple-system, "Helvetica Neue", sans-serif;
    background: #fbfaf7; color: #1d1d1f;
    padding: 40px 56px 28px;
    display: flex; flex-direction: column;
  }
  header { display: flex; align-items: center; gap: 18px; margin-bottom: 20px; }
  header img { width: 56px; height: 56px; }
  h1 { font-size: 40px; font-weight: 800; letter-spacing: -0.02em; }
  header p { font-size: 20px; color: #6b6b70; margin-top: 4px; }
  header p b { color: #1d1d1f; font-weight: 700; }

  table { width: 100%; border-collapse: separate; border-spacing: 0; table-layout: fixed; flex: 1; }
  col.label { width: 310px; }
  th { font-size: 22px; font-weight: 700; padding: 14px 10px; text-align: center; }
  th.karotte { background: #ff8d02; color: #fff; border-radius: 16px 16px 0 0; }
  td { padding: 12px 10px; text-align: center; border-top: 1px solid #e8e6e0; vertical-align: top; padding-top: 18px; }
  td.karotte { background: #fff3e3; border-top-color: #fbe0bd; }
  tr:last-child td.karotte { border-radius: 0 0 16px 16px; }
  td.row { text-align: left; padding-left: 0; vertical-align: middle; padding-top: 12px; }
  td.row b { display: block; font-size: 20px; font-weight: 700; }
  td.row span { display: block; font-size: 15px; color: #6b6b70; margin-top: 3px; }

  .cell { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .cell svg { width: 34px; height: 34px; }
  .cell span { font-size: 14.5px; color: #55555a; line-height: 1.3; max-width: 200px; }

  footer { display: flex; justify-content: space-between; align-items: center; margin-top: 22px; font-size: 15px; color: #8a8a90; }
  .legend { display: flex; gap: 22px; }
  .legend div { display: flex; align-items: center; gap: 7px; }
  .legend svg { width: 20px; height: 20px; }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute">
  <symbol id="yes" viewBox="0 0 24 24"><circle cx="12" cy="12" r="12" fill="#1fa855"/><path d="M6.5 12.5l3.7 3.7 7.3-8" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="part" viewBox="0 0 24 24"><circle cx="12" cy="12" r="12" fill="#f2b100"/><path d="M7 12h10" stroke="#fff" stroke-width="2.8" stroke-linecap="round"/></symbol>
  <symbol id="no" viewBox="0 0 24 24"><circle cx="12" cy="12" r="12" fill="#e5484d"/><path d="M8 8l8 8M16 8l-8 8" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/></symbol>
</svg>

<header>
  <img src="../../docs/assets/carrot.svg" alt="">
  <div>
    <h1>Only Karotte blocks all five of these agent tricks by default</h1>
    <p>Each framework in its <b>default setup</b>, run with a scripted agent that cheats on purpose and doesn't know the answer</p>
  </div>
</header>

<table>
  <colgroup><col class="label"><col><col><col><col><col><col></colgroup>
  <thead><tr id="head"><th></th></tr></thead>
  <tbody id="rows"></tbody>
</table>

<footer>
  <div class="legend">
    <div><svg><use href="#yes"/></svg>Protected by default</div>
    <div><svg><use href="#part"/></svg>Partly protected by default</div>
    <div><svg><use href="#no"/></svg>Not protected by default</div>
  </div>
</footer>

<script>
const frameworks = ["Karotte", "Harbor", "HUD", "AgentEnv", "verifiers", "Inspect"];
const rows = [
  ["Reading the answer key", [
    ["yes", "Answer files are root-only and the agent isn't root"],
    ["yes", "Tests are copied in after the agent finishes"],
    ["yes", "Grading data never enters the agent's sandbox"],
    ["yes", "Grading data never enters the agent's container"],
    ["yes", "Answers never enter the agent's container"],
    ["yes", "Answers never enter the agent's container"],
  ]],
  ["Tampering with grading", [
    ["yes", "Agent is stopped first; the grader reads a copy the agent can't touch"],
    ["no", "Before grading, the agent wrote a full score into the file Harbor reads scores from"],
    ["no", "A process the agent left running swapped the hidden tests for ones that always pass"],
    ["part", "File checks held; the agent replaced bash, so command checks always passed"],
    ["part", "Transcript checks held; the agent rewrote the grading script it found on disk"],
    ["part", "Built-in scorers held; the agent replaced python3, so sandbox checks passed"],
  ]],
  ["Breaking grading with a weird answer file", [
    ["yes", "Links and special files are refused and score 0"],
    ["no", "A pipe as the answer hung grading, then the run errored"],
    ["no", "A pipe as the answer hung grading for an hour, then the run errored"],
    ["yes", "A pipe or sparse file stalled grading for up to 2 minutes, then scored&nbsp;0"],
    ["no", "A pipe as the answer hung grading forever"],
    ["no", "A pipe as the answer made the whole eval end in an error"],
  ]],
  ["Crashing the run by using up memory, processes or disk", [
    ["yes", "The VM caps memory, processes and disk"],
    ["no", "No limits; one agent can use up memory, processes and disk for the whole machine"],
    ["no", "No limits; one agent can use up memory, processes and disk for the whole machine"],
    ["no", "No limits; one agent can use up memory, processes and disk for the whole machine"],
    ["part", "On Prime, memory is capped at 2 GB and disk at 5 GB; no process limit is set"],
    ["no", "No limits; one agent can use up memory, processes and disk for the whole machine"],
  ]],
  ["Looking up the answer online", [
    ["yes", "Firewalled, and checked before the agent starts"],
    ["no", "Agent reached the internet"],
    ["yes", "Sandbox has no network"],
    ["no", "Agent reached the internet"],
    ["no", "Agent reached the internet"],
    ["yes", "Sandbox has no network"],
  ]],
];
const head = document.getElementById("head");
frameworks.forEach((name, i) => {
  head.insertAdjacentHTML("beforeend", `<th${i === 0 ? ' class="karotte"' : ""}>${name}</th>`);
});
const tbody = document.getElementById("rows");
for (const [title, cells] of rows) {
  const tr = document.createElement("tr");
  tr.innerHTML = `<td class="row"><b>${title}</b></td>` +
    cells.map(([icon, note], i) =>
      `<td${i === 0 ? ' class="karotte"' : ""}><div class="cell"><svg><use href="#${icon}"/></svg><span>${note}</span></div></td>`
    ).join("");
  tbody.appendChild(tr);
}
</script>
</body>
</html>
